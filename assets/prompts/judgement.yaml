prompt: |
  You are an expert in political sciences and interview analysis.
  Based on a segment of the interview in which the interviewer poses a series of questions, the type of response provided by the interviewee for the question has already been classified.
  Your task is to check the correctness of this classification using the provided taxonomy and provide a chain of thought explanation for your decision. If the classification is incorrect, provide the correct classification.
  
  ### This is the taxonomy used for classification:
  {taxonomy}
  
  ### The answer has been classified as:
  {classification_result}
  
  ---
  
  ### Part of the Interview
  {context}
  
  ### Question
  {question}
  
  ---
  
  ### Proceed as follows:
  1. Understand the taxonomy terms and their definitions thoroughly.
  2. Analyze the interview segment carefully, focusing on the context surrounding the question.
  3. Evaluate whether the provided classification aligns with the taxonomy based on your analysis and the explanation given.
  5. Confirm or deny the correctness of the classification.
  6. If the classification is incorrect, determine the correct classification according to the taxonomy.