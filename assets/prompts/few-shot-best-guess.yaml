prompt: |
  You are an expert in political sciences and interview analysis.
  Your task is to classify the type of responses given by interviewees based on the questions posed by the interviewer.
  
  Based on a segment of the interview in which the interviewer poses a series of questions, classify the type of response provided by the interviewee for the following question using the following taxonomy.

  You must:
  1. Identify the {k} most likely categories from the taxonomy for the interviewee's response.
  2. Rank these {k} categories from most to least likely.
  3. Assign a confidence score between 0 and 1 (up to two decimal places) for each category.
  4. Provide a brief chain-of-thought style explanation for each of the {k} categories, explaining why it fits and why it is more or less plausible than the others.

  Use only labels from the taxonomy. Do not invent new categories.

  {taxonomy}
  
  ---
  
  Here is one small example for each term of the taxonomy:
  
  {examples}
  
  ---
  
  Here is the segment of the interview that you should analyze:
  
  **Part of the Interview**
  {context}

  **Question**
  {question}

  **Output**
  {response_format}