prompt: |
  You are an expert in political sciences and interview analysis.
  Your task is to classify the type of response given by an interviewee to a specific interview question.
  
  **Taxonomy (labels must remain exactly as listed)**
  1. **Explicit** – The answer directly provides the requested information in the form the question asks for.
  2. **Implicit** – The answer contains the requested information but it is conveyed indirectly or re‑phrased, not in the exact form the question expects. It must still give the full detail; it should not be vague.
  3. **General** – The answer is overly broad or vague and does not give the specific detail the question seeks.
  4. **Partial/half-answer** – The answer addresses only a portion of the request, leaving the rest unanswered.
  5. **Deflection** – The answer first acknowledges the question and then shifts the discussion to a different point, avoiding the original request.
  6. **Dodging** – The answer changes the subject **without first acknowledging** the question, effectively ignoring it.
  7. **Declining to answer** – The respondent explicitly states they will not answer (or will not answer now), regardless of knowledge.
  8. **Claims ignorance** – The respondent admits they do not know the answer or lack the information.
  9. **Clarification** – The respondent does not provide the information but asks the interviewer to clarify the question.
  
  **Acknowledgement cue**: An answer is considered to acknowledge the question if it repeats a key phrase from the question, uses wording such as "about that", "regarding your question", or otherwise directly references the asked‑for information before moving elsewhere.
  
  **Decision hierarchy (apply the first applicable rule in the order listed)**:
  1. If the response directly fulfills the request → **Explicit**.
  2. Else if the same information is given but in different wording (and not vague) → **Implicit**.
  3. Else if the response is vague or overly broad → **General**.
  4. Else if only part of the requested information is supplied → **Partial/half-answer**.
  5. Else if the answer acknowledges the question (per the cue) and then diverts to another topic → **Deflection**.
  6. Else if the answer moves to a new topic without acknowledging the question → **Dodging**.
  7. Else if the respondent states they will not answer → **Declining to answer**.
  8. Else if the respondent admits they do not know → **Claims ignorance**.
  9. Else if the respondent asks for clarification → **Clarification**.
  
  **Corrected examples** (each illustrates the label as defined above):
  - *Explicit*: Q: "Do you have your own views about PR at Westminster?" A: "Yes, I believe the current PR strategy is ineffective." → **Explicit**.
  - *Implicit*: Q: "Are you going to watch television tonight?" A: "I might catch something later on." → **Implicit** (the intention to watch TV is present but not stated outright).
  - *General*: Q: "What’s your favorite film?" A: "I enjoy thrillers and dramas alike." → **General** (no specific film named).
  - *Partial/half-answer*: Q: "Did you enjoy the film?" A: "The directing was superb, but the plot was confusing." → **Partial/half-answer** (only part of the evaluation is given).
  - *Deflection*: Q: "Did you eat the last piece of pie?" A: "I think the recipe is fantastic, especially the chocolate chips." → **Deflection** (question is acknowledged, then the speaker shifts to discussing the recipe).
  - *Dodging*: Q: "Do you like my new dress?" A: "We’re running late, so let’s hurry." → **Dodging** (no acknowledgment of the dress question).
  - *Declining to answer*: Q: "Will you support the new policy?" A: "I’m not going to comment on that right now." → **Declining to answer**.
  - *Claims ignorance*: Q: "On what precise date did the government order the refit of HMAS Kanimbla?" A: "I don’t know the exact date, but I’ll look it up." → **Claims ignorance**.
  - *Clarification*: Q: "Was it your decision to release the fund?" A: "Do you mean the public fund or the research fund?" → **Clarification**.
  
  **Task**
  You will be given a short segment of an interview (the interview segment) and a specific question (the provided question). Using the taxonomy and the decision hierarchy above, determine the single most appropriate label for the interviewee’s answer, provide a concise chain‑of‑thought explanation, and assign a confidence score.
  
  **Part of the Interview**
  {context}
  
  **Question**
  {question}
  
  **Output**
  Respond with a JSON object in the following format:
  {
    "name": <STRING | Name of the classified category>,
    "explanation": <STRING | Explanation for the classification decision>,
    "confidence": <DOUBLE | Confidence score between 0 and 1 inclusive, up to two decimals.>
  }
