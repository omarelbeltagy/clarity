prompt: |
  You are an expert in political sciences and interview analysis.
  Your task is to classify the type of responses given by interviewees based on the questions posed by the interviewer.
  
  Based on a segment of the interview in which the interviewer poses a series of questions, classify the type of response
  provided by the interviewee for the following question using the following taxonomy and then provide a brief, evidence-based explanation for your decision (1–3 sentences). Quote or paraphrase the key phrase(s) that justify the label.
  
  Taxonomy (category names must be used exactly):
  1. Explicit - The requested information is directly stated (including direct yes/no or a direct attribute/value) at the specificity/granularity the question demands.
  2. Implicit - The requested information is not directly stated but is nevertheless clearly committed to and can be inferred unambiguously from what is said in context.
  3. General - The response attempts to address the requested variable but remains too vague/unspecific to supply the requested value.
  4. Partial/half-answer - Answers at least one explicitly requested component/condition/sub-question, but not all.
  5. Dodging - Does not answer the requested variable; may talk around it or provide adjacent/related context, but does not provide the asked-for information.
  6. Deflection - Briefly engages with the question/topic but pivots to a different main point/talking point (often answering a different proposition) instead of answering the requested variable.
  7. Declining to answer - Acknowledges the question but refuses to answer or indicates they cannot discuss it (e.g., “I won’t comment,” “I can’t discuss that,” “I can’t answer that,” “that’s not appropriate,” “I’m not allowed to say,” or directing the interviewer elsewhere as a substitute for answering, e.g., “ask X / read the report” instead of giving the information).
  8. Claims ignorance - States they do not know, are not aware of, or do not have the information needed for the requested variable.
  9. Clarification - Asks a genuine clarifying question needed to understand what is being asked and does not provide the requested information yet.
  
  Decision rules (apply in order):
  
  1) Identify the “requested variable” (slot)
  - Identify exactly what specific information the question requests (the “requested variable”), including each explicit sub-part, condition, timeframe, or forced-choice option. Treat this as a concrete slot that must be filled (e.g., a specific yes/no, named choice, actor, date/number, stance, or action).
  
  2) Check for a slot-fill FIRST (hard precedence)
  - Before considering General/Dodging/Deflection, scan the entire response for ANY clear commitment that fills the requested slot at the specificity level demanded.
    - If all explicitly requested parts/conditions are filled → Explicit (or Implicit if only inferable under rule 5).
    - If some (but not all) explicitly requested parts/conditions are filled → Partial/half-answer.
  - Only if there is NO clear slot-fill anywhere should you choose among General/Dodging/Deflection (or Declining/Claims ignorance/Clarification).
  
  3) What counts as a slot-fill (and what does NOT)
  - Count as answering only if the response fills the slot with a clear commitment at the same specificity level the question demands.
    - Do NOT treat as answering: mere topic alignment, reassurance, rhetorical soothing, slogans, broad principles, policy/process descriptions, meta-commentary about discussion, future intent (“we’ll look at it”), promises to decide later, or conditional/hedged non-commitments (“it depends,” “we’ll see,” “in due course”), unless they STILL clearly commit to a particular value/side now.
    - Specificity match: If the question asks for concrete details (e.g., who/what/when/which terms/what exactly was said), then abstract aspirations, broad principles, or “we discussed X” without the requested specifics are NOT an answer.
    - Reframing is not automatically an answer: A response may reject the premise or reframe and STILL answer—but only if it clearly commits to the requested slot value/side.
  
  4) Declining / ignorance / clarification detection (before General/Dodging/Deflection)
  - If the response includes refusal/constraint language, label Declining to answer UNLESS the speaker nevertheless provides the requested slot value at the required specificity.
    - Treat “soft” political constraints as Declining to answer when they function as non-disclosure (e.g., “I can’t get into that,” “I’m not going to talk about that,” “we keep that close to the vest,” “it’s not appropriate to discuss details,” “I’m not at liberty”).
    - If refusal/constraint is followed by generic positivity/progress talk, do NOT upgrade to Explicit/Implicit unless the slot is actually filled.
  - Use Claims ignorance when the speaker indicates lack of knowledge/awareness/certainty about the requested variable (including “I don’t know,” “I’m not aware,” “I haven’t seen,” “I don’t have that information,” “I’m not sure,” “as far as I know,” “I assume,” “I’ve heard,” or other language that signals they cannot vouch for the asked-for fact).
  - Use Clarification if the response is a genuine question needed to understand what is being asked and does not yet provide the requested information.
  
  5) Implicit (use narrowly, but do not miss real commitments)
  - Use Implicit ONLY when the response leaves only one materially plausible value/side for the requested slot.
    - If the statement could reasonably fit multiple values/sides (e.g., reassurance, optimism, “we’re working on it,” “we take it seriously,” “we’re making progress,” “we’ll review”), do NOT label Implicit.
    - In those cases: use General (if they are trying to give the slot value but it stays vague) or Dodging/Deflection (if they avoid giving the slot value).
  - Explicit vs Implicit guardrail: Explicit requires the slot value be directly stated at the demanded granularity; if the slot value is only obtained by inference (even strong inference), it is Implicit, not Explicit.
  
  6) Forced-choice / yes-no / evaluative questions
  - For forced-choice or yes/no questions: the response must clearly commit to one side (Explicit OR Implicit under rule 5). Non-committal hedging (“maybe/it depends/we’ll decide later”) is not an answer.
  - For evaluative yes/no asks (e.g., “is there a problem?”, “should people worry?”, “was that a mistake?”): citing related facts, describing efforts, or expressing confidence/concern does NOT automatically equal “yes” or “no” unless the speaker actually makes that judgment.
  
  7) Multi-part, conditional, and list/boundary questions
  - Explicit = all explicitly requested parts/conditions are answered with clear commitments.
  - Partial/half-answer = at least one explicitly requested part/condition is answered with a clear commitment, but not all.
  - Guardrail (avoid Partial overuse): If the question asks for actions/measures/steps and does NOT explicitly require an exhaustive list (or explicitly require both sides such as “what will you do” AND “what won’t you do”), then providing one concrete committed measure can be sufficient for Explicit.
  - If the speaker answers a different condition/version than asked (e.g., answers “with a deal” while avoiding the asked “if no deal by date”), treat that as Deflection unless they also clearly commit on the asked condition.
  
  8) If none of the requested parts are answered: choose General vs Dodging vs Deflection
  - General = the speaker is trying to answer the same requested slot (attempting to provide the value/side) but the value remains too vague/underspecified to fill it.
  - Deflection = the speaker substitutes a different proposition/variable as the main answer OR explicitly pivots to a new agenda/main claim that could stand alone as what they want to talk about instead of answering the slot (often signaled by “the real issue is…,” “what matters is…,” attacking the questioner/premise, or switching to broader messaging). If they still clearly fill the slot, do NOT use Deflection.
  - Dodging = the speaker does not fill the slot and does not clearly substitute a different proposition as the main answer; includes stalling, meandering adjacent remarks, or on-topic context that never supplies the requested value.
  
  9) Evidence requirement (keep it tight)
  - In 1–3 sentences (prefer 1–2 unless truly necessary), quote or paraphrase the single strongest phrase(s) that contain the slot-fill (Explicit/Implicit/Partial) OR the refusal/ignorance/clarifying question/pivot/vagueness (Declining/Claims ignorance/Clarification/Deflection/General/Dodging).
  
  ---
  Here is one small example for each term of the taxonomy:
  
  Question: Do you have your own views about PR at Westminster don’t you?
  Answer: I do.
  Label: Explicit
  Explanation: The answer directly provides the requested yes/no information.
  
  Question: Are you going to watch television?
  Answer: What else is there to do?
  Label: Implicit
  Explanation: The answer implies “yes” with essentially no other plausible interpretation.
  
  Question: What’s your favorite film?
  Answer: I like all kinds of movies—hard to pick just one.
  Label: General
  Explanation: The reply stays on the requested variable but is too vague to identify a specific favorite.
  
  Question: Do you support the bill, and will you vote for it today?
  Answer: I support the bill.
  Label: Partial/half-answer
  Explanation: It answers one explicitly requested component (“support”) but not the other (“vote for it today”).
  
  Question: Do you like my new dress?
  Answer: We are late.
  Label: Dodging
  Explanation: The answer does not address the question.
  
  Question: Did you eat the last piece of pie?
  Answer: Look, the real issue is that we need healthier options in this house.
  Label: Deflection
  Explanation: The speaker pivots to a different main point (“the real issue… healthier options”) instead of answering whether they ate it.
  
  Question: The hypothesis I was discussing, wouldn’t you regard that as a defeat?
  Answer: I am not going to prophesy what will happen.
  Label: Declining to answer
  Explanation: The speaker explicitly refuses to answer.
  
  Question: On what precise date did the government order the refit of the HMAS Kanimbla in preparation for its forward deployment to a possible war against Iraq?
  Answer: I do not know that date. I will find out and let the House know.
  Label: Claims ignorance
  Explanation: The speaker explicitly states they do not know.
  
  Question: Was it your decision to release the fund?
  Answer: You mean the public fund?
  Label: Clarification
  Explanation: The speaker asks what the term refers to before answering.
  
  ---
  Additional targeted guardrail examples:
  
  Question: Should people be worried about X?
  Answer: We’re working around the clock and we have this under control.
  Label: Dodging
  Explanation: Reassurance does not explicitly or unambiguously answer “yes/no” to whether people should be worried.
  
  Question: Will you resign?
  Answer: I’m focused on delivering for the public; we’ll review matters in due course.
  Label: Dodging
  Explanation: Future-intent/process language does not commit to “yes” or “no.”
  
  Question: Did you approve the report?
  Answer: You should ask the department / read the report.
  Label: Declining to answer
  Explanation: Directing elsewhere substitutes for answering.
  
  Question: Did the administration sanction torture?
  Answer: Waterboarding was torture.
  Label: Deflection
  Explanation: The speaker answers a different proposition (a moral/definitional claim) instead of the requested yes/no about sanctioning.
  
  ---
  Here is the segment of the interview that you should analyze:
  
  **Part of the Interview**
  {contextClean}
  
  **Question**
  {questionClean}
  
  **Output**
  Respond with a JSON object in the following format:
  {
    "name": <STRING | Name of the classified category>,
    "explanation": <STRING | Explanation for the classification decision>,
    "confidence": <DOUBLE | Confidence score between 0 and 1 inclusive, up to two decimals.>
  }
