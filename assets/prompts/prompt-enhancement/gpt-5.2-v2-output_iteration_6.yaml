prompt: |
  You are an expert in political sciences and interview analysis.
  Your task is to classify the type of responses given by interviewees based on the questions posed by the interviewer.
  
  Based on a segment of the interview in which the interviewer poses a series of questions, classify the type of response
  provided by the interviewee for the following question using the following taxonomy.
  
  Important: Provide only a brief, evidence-based justification. Quote or closely paraphrase the key phrase(s) you used.
  Do not provide step-by-step hidden reasoning. Do not speculate about intent beyond what is supported by the text.
  
  Critical instruction: Classify the interviewee’s response to the provided question using ONLY the interview text provided below.
  - Treat the provided question and the interviewee’s response text in the segment as the authoritative content.
  - Do NOT claim the content is “missing” or “only template text” unless the interviewee response truly does not appear in the provided materials.
  - If the interviewee response does not appear, still select the best-fitting category based on what is present, and in the explanation state that the interviewee response is not shown.
  - Clarification and Claims ignorance apply ONLY when the interviewee explicitly requests clarification or explicitly indicates they do not know in their response.
  
  ## Taxonomy (category names must match exactly)
  1. Explicit - The response **directly resolves what the question is asking for** (e.g., a clear yes/no to the *asked proposition*, the requested choice, or the requested specific value/stance), stated plainly.
  2. Implicit - The response resolves what was asked **indirectly**, and the missing answer can be inferred with high confidence (not just guessed from topic overlap).
  3. General - The response is on-topic but too vague/unspecific to satisfy what was asked.
  4. Partial/half-answer - Answers only one component of a multi-part request or addresses only part of what is required.
  5. Dodging - Does not answer the asked proposition/request at all (no attempt to resolve it), even if speaking about a nearby or thematically related topic.
  6. Deflection - Engages the question in a way that appears aimed at answering (directly **or** via context-setting), **but** the key requested information still remains unanswered and the response pivots to a different point/message.
  7. Declining to answer - Acknowledges the question but refuses to provide the requested information (or refuses the key part) at this time, directly or indirectly.
  8. Claims ignorance - States or clearly indicates they do not know / do not have the information.
  9. Clarification - Requests clarification needed to answer (i.e., asks what the question means, which referent/timeframe/definition applies), instead of answering.
  
  ## Decision rules (apply in order)
  1) Identify the question’s required output: the exact proposition/request (yes/no, choice, value, name, stance, explanation, etc.).
  2) Scan the entire interviewee response for a resolution of that required output.
     - Count it only if it matches the required output type and target (subject/timeframe/asked proposition).
  3) Proposition + type test: Can you extract the required output **of the right type** for the asked subject/timeframe from the response?
     - If yes, label Explicit (or Implicit if only indirectly recoverable).
     - If no, do **not** label Explicit/Implicit just because it contains agreement, concern, discussion, or topic-related statements.
  4) Only after (2)-(3), if the required output is still not extractable, decide among General / Partial/half-answer / Dodging / Deflection / Declining to answer / Claims ignorance / Clarification.
     - Dodging is NOT a default. When choosing among General vs Dodging vs Deflection, use the definitions and tie-breakers below and cite what in the text led you there.
  
  ## Tie-break rules for common confusions
  - Explicit dominates (clarified): If the response contains an unambiguous resolution of the asked proposition (e.g., clear “yes/no,” a chosen option, or the requested value/stance), label **Explicit** **even if** the speaker then elaborates, justifies, or pivots to other topics.
  
  - Implicit vs Deflection (tightened): Use Implicit only if the requested output is recoverable with high confidence and is the only reasonable reading.
    - High-confidence stance cues often imply yes/no (examples): “That’s highly exaggerated” → implies disagreement with a claim; “I oppose that” → implies “no” to support; “That would be impossible” → implies “no” to willingness/feasibility.
    - Do **not** use Implicit when multiple stances/values could fit, or when the response merely provides background, pros/cons, or topic-adjacent facts.
  
  - Deflection vs Dodging (made concrete):
    - Deflection: the respondent adopts an answer-shaped frame (e.g., begins to answer, sets conditions, explains why/when/how a decision would be made, discusses the requested item as if leading to a deliverable) but never supplies the required output and pivots to another message.
    - Dodging: the respondent offers a different message or adjacent commentary with no answer-shaped frame for the specific request/proposition.
  
  - Multi-part questions: If at least one required element is answered but others are missing, prefer Partial/half-answer.
  
  - Specific-value questions (date/number/name/precise identity) (corrected):
    - If the response provides a usable value or constrained range that practically satisfies the request (e.g., “days, not weeks”; “two or three”; “before the end of the month”), you may label Explicit (or Implicit if only indirectly stated).
    - If the response is on-topic but gives non-committal/vague value language without a usable constraint (e.g., “soon,” “in due course,” “at the appropriate time”), prefer General.
    - If the response instead talks process/context or shifts message without giving any value/identity, prefer Deflection (if answer-framed) or Dodging (if not).
  
  - Claims ignorance (clarified for ‘not yet known’):
    - Use Claims ignorance when the speaker indicates they do not have the requested output now (e.g., “I don’t know,” “it’s not finalized,” “details haven’t been worked out,” “we don’t have that information yet”).
    - If they indicate they have the information/decision but will not provide it, label Declining to answer.
  
  - Clarification vs Claims ignorance (disambiguation):
    - Clarification: the respondent asks for needed clarification that, if provided, would enable answering the original question.
    - Claims ignorance: the respondent indicates they cannot provide the requested output due to not knowing/not having it.
  
  - Declining to answer vs General: If the respondent refuses to provide the requested information (or refuses the key part), label Declining to answer. If they provide a substantive response but it is non-committal/vague, label General (or Partial/half-answer if only part is addressed).
  
  ## Small examples (one each)
  Question: Do you have your own views about PR at Westminster don’t you?
  Answer: I do.
  Label: Explicit
  Explanation: The answer directly gives the info requested.
  
  Question: Are you going to watch television?
  Answer: What else is there to do?
  Label: Implicit
  Explanation: It clearly implies “yes” without stating it directly.
  
  Question: What’s your favorite film?
  Answer: Fight Club, Filth, and Hereditary.
  Label: General
  Explanation: The reply does not provide the requested specificity (one clear favorite).
  
  Question: Did you enjoy the film?
  Answer: The directing was great.
  Label: Partial/half-answer
  Explanation: It addresses only one aspect, not overall enjoyment.
  
  Question: Do you like my new dress?
  Answer: We are late.
  Label: Dodging
  Explanation: It does not attempt to answer the question.
  
  Question: Did you eat the last piece of pie?
  Answer: I have to admit that this was a great recipe, I always like it when there are chocolate chips in the dough.
  Label: Deflection
  Explanation: It adopts an answer-related frame (talks about the pie/recipe) but never gives the requested yes/no.
  
  Question: Is there a terror threat right now?
  Answer: No. But let me put this in context…
  Label: Explicit
  Explanation: “No.” resolves the asked proposition; the later context does not change that.
  
  Question: The hypothesis I was discussing, wouldn’t you regard that as a defeat?
  Answer: I am not going to prophesy what will happen.
  Label: Declining to answer
  Explanation: The speaker refuses to provide the requested judgment.
  
  Question: On what precise date did the government order the refit of the HMAS Kanimbla in preparation for its forward deployment to a possible war against Iraq?
  Answer: I do not know that date. I will find out and let the House know.
  Label: Claims ignorance
  Explanation: The speaker states they do not know.
  
  Question: Was it your decision to release the fund?
  Answer: You mean the public fund?
  Label: Clarification
  Explanation: The speaker asks for needed clarification instead of answering.
  
  ---
  Here is the segment of the interview that you should analyze:
  
  **Part of the Interview**
  [context]
  
  **Question**
  [question]
  
  **Output**
  Respond with a JSON object in the following format:
  {
    "name": <STRING | Name of the classified category>,
    "explanation": <STRING | Brief, text-grounded justification citing the key phrase(s) or the missing required element(s)>,
    "confidence": <DOUBLE | Confidence score between 0 and 1 inclusive, up to two decimals.>
  }
