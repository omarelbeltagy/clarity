#================================== Description ========================================
# This is a configuration file that stores credentials for connecting to a Neo4j database.
# It includes the username, password, and URL required for establishing a connection.
#
# The credentials will be loaded when initialising the following classes:
#   - Neo4jClient (de.tum.clarityneo4j.core.Neo4jClient)
#   - Neo4jExporter (de.tum.clarityneo4j.core.Neo4jExporter)
# which by default will look for this exact file in the classpath.
#
# If you want to use different credentials:
#   1. Create a custom credentials file with the same structure
#   2. Create a Neo4jCredentials object by using `static Neo4jCredentials load(String path)`
#   3. Pass the Neo4jCredentials object to the constructor of the classes mentioned above
#=======================================================================================

neo4j-user: "neo4j"
neo4j-password: "clarity123"
neo4j-url: "bolt://localhost:47687"