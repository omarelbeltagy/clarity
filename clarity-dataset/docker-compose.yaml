#================================== Description ========================================
# Docker Compose file to build and run the clarity-dataset image which downloads and
# prepares datasets for further use.
#
# To start the dataset service, you can use either of the following methods:
#   1. From the command line, navigate to `clarity-dataset/` and run
#        `docker compose up -d`
#   2. Use the IntelliJ Docker plugin to run this file as a Docker Compose configuration.
#
# To force a rebuild of the image, use:
#        `docker compose build --no-cache`
#=======================================================================================

services:
  dataset:
    container_name: "clarity-dataset"
    build:
      context: ..
      dockerfile: "clarity-dataset/Dockerfile"
    platform: "linux/amd64"
    volumes:
      - "./app.py:/app/app.py"
      - "./cleaning.py:/app/cleaning.py"
      - "./logging.yaml:/app/logging.yaml"
      - "./utils:/app/utils"
      - "./data:/data"
      - "../assets/prompts/lora.yaml:/app/lora-prompt.yaml"
    environment:
      - "DARA_DIR=/data"
      - "LORA_PROMPT_FILE=/app/lora-prompt.yaml"
    restart: "no"