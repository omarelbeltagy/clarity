#================================== Description ========================================
# Docker Compose file to build and run the clarity-dataset image which downloads and
# prepares datasets for further use.
#
# Usage examples:
#   1. Basic run (no cleaning, no BERT):
#        docker compose up
#
#   2. Run with flags - use 'run' instead of 'up':
#        docker compose run --rm dataset --clean-all
#        docker compose run --rm dataset --use-bert
#        docker compose run --rm dataset --clean-all --use-bert
#        docker compose run --rm dataset --clean-fillers
#        docker compose run --rm dataset --clean-names
#
# Available flags:
#   --clean-fillers    Remove filler words (um, uh, you know, etc.)
#   --clean-names      Remove president names and titles
#   --clean-all        Apply both cleaning options
#   --use-bert         Generate BERT-based summary embeddings
#=======================================================================================

services:
  dataset:
    container_name: "clarity-dataset"
    build:
      context: ..
      dockerfile: "clarity-dataset/Dockerfile"
    platform: "linux/amd64"
    volumes:
      - "./app.py:/app/app.py"
      - "./clean.py:/app/clean.py"
      - "./summarize.py:/app/summarize.py"
      - "./logging.yaml:/app/logging.yaml"
      - "./utils:/app/utils"
      - "./data:/data"
      - "../assets/prompts/lora.yaml:/app/lora-prompt.yaml"
    environment:
      - "DATA_DIR=/data"
      - "LORA_PROMPT_FILE=/app/lora-prompt.yaml"
    restart: "no"