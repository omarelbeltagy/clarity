name: "gpt-5-nano"
cluster: "OpenAI"
version: "judgement:v1"
taxonomy: "../assets/taxonomy/clarity-categories.yaml"
worker-threads: 16
query: |
  MATCH (n:QA)
  WHERE n.test = true
  RETURN n
strategy:
  type: "judgement"
  classification-model:
    provider: "openai"
    name: "gpt-5-nano"
    prompt: "../assets/prompts/few-shot.yaml"
  judgement-model:
    provider: "openai"
    name: "gpt-5-nano"
    prompt: "../assets/prompts/judgement.yaml"