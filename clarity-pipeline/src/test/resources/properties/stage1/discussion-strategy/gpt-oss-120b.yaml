name: "gpt-oss-120b"
cluster: "OpenAI"
version: "judgement:v2"
taxonomy: "../assets/taxonomy/clarity-categories.yaml"
worker-threads: 16
query: |
  MATCH (n:QA)
  WHERE n.test = true
  RETURN n
strategy:
  type: "judgement"
  classification-model:
    provider: "together"
    name: "openai/gpt-oss-120b"
    prompt: "../assets/prompts/few-shot.yaml"
  judgement-model:
    provider: "together"
    name: "openai/gpt-oss-120b"
    prompt: "../assets/prompts/judgement.yaml"