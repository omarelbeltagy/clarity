name: "GPT 5.1"
version: "evaluation:judgement:evasion:v1"
taxonomy: "../assets/taxonomy/evasion-techniques.yaml"
worker-threads: 80
query: |
  MATCH (n:QA)
  WHERE n.evaluation = true
  RETURN n
strategy:
  type: "judgement"
  use-existing: true
  classification-model:
    provider: "openai"
    name: "gpt-5.1"
    prompt: "../assets/prompts/few-shot.yaml"
  judgement-model:
    provider: "openai"
    name: "gpt-5.1"
    reasoning-effort: "high"
    prompt: "../assets/prompts/judgement-enhanced.yaml"
