name: "GPT 5.2"
version: "reasoning-high:enhanced-prompt:evasion-based:judgement:few-shot:v2"
taxonomy: "../assets/taxonomy/evasion-techniques.yaml"
worker-threads: 80
query: |
  MATCH (n:QA)
  WHERE n.test = true
  RETURN n
strategy:
  type: "judgement"
  use-existing: true
  classification-model:
    provider: "openai"
    name: "gpt-5.2"
    prompt: "../assets/prompts/few-shot.yaml"
  judgement-model:
    provider: "openai"
    name: "gpt-5.2"
    reasoning-effort: "high"
    prompt: "../assets/prompts/judgement-enhanced-gpt-5.2-v2.yaml"
