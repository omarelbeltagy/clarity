name: "GPT 5.2"
version: "rag:reasoning-effort-auto:evasion-based:single:few-shot:v1"
taxonomy: "../assets/taxonomy/evasion-techniques.yaml"
worker-threads: 16
query: |
  MATCH (n:QA)
  WHERE n.test = true
  RETURN n
strategy:
  type: "single"
  model:
    provider: "openai"
    name: "gpt-5.2"
    prompt: "../assets/prompts/few-shot-rag.yaml"
    rag:
      enabled: true
      k: 1
      embedding-index: "qa_question_and_answer"
